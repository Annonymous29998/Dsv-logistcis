<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>DSV Logistics Control</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="/resource/admin/css/admin.css?v=20261102pkg2">
  <script>
    // Block dashboard until session is confirmed; bounce guests to login.
    (function () {
      document.documentElement.classList.add("admin-auth-pending");
      fetch("/api/admin/me", { credentials: "same-origin", cache: "no-store" })
        .then(function (res) { return res.ok ? res.json() : null; })
        .then(function (data) {
          if (!data || !data.authenticated) {
            window.location.replace("/admin/login");
            return;
          }
          document.documentElement.classList.remove("admin-auth-pending");
        })
        .catch(function () {
          window.location.replace("/admin/login");
        });
    })();
  </script>
  <style>
    html.admin-auth-pending body { visibility: hidden; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
</head>
<body>
  <div class="overlay-nav" id="nav-overlay" hidden></div>
  <div class="shell">
    <aside class="sidebar" aria-label="Admin navigation">
      <div class="sidebar__brand">
        <div class="sidebar__brand-main">
          <div class="login-brand__mark">DSV</div>
          <div class="sidebar__brand-text">
            <strong>DSV Control</strong>
            <span>Logistics Solutions</span>
          </div>
        </div>
        <button type="button" class="sidebar-toggle" id="btn-sidebar-toggle" aria-label="Collapse sidebar" aria-expanded="true" title="Collapse sidebar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
        </button>
      </div>
      <nav class="nav" id="side-nav"></nav>
      <div class="sidebar__foot">
        <button type="button" class="btn-logout-side" id="btn-logout" title="Logout">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          <span>Logout</span>
        </button>
      </div>
    </aside>

    <main class="content">
      <header class="topbar">
        <button type="button" class="menu-btn" id="btn-menu" aria-label="Open menu">☰</button>
        <div class="topbar__left">
          <div class="search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3-3"/></svg>
            <input id="global-search" type="search" placeholder="Search shipments…">
          </div>
        </div>
        <div class="top-actions">
          <button type="button" class="icon-btn" id="btn-notifications" aria-label="Notifications" aria-haspopup="dialog" aria-expanded="false">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 7-3 7h18s-3 0-3-7"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
            <span class="dot" id="notif-count" aria-hidden="true">0</span>
          </button>
          <span class="top-actions__divider" aria-hidden="true"></span>
          <div class="user-menu" id="user-menu">
            <button type="button" class="user-chip" id="user-menu-btn" aria-label="Administrator menu" aria-haspopup="menu" aria-expanded="false">
              <img src="/resource/unsplash/person-3.webp" alt="">
              <div class="user-chip__meta">
                <strong id="admin-name">Admin User</strong>
                <span id="admin-role">Administrator</span>
              </div>
              <svg class="user-chip__chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
            </button>
            <div class="user-menu__dropdown" id="user-menu-dropdown" role="menu" hidden>
              <button type="button" class="user-menu__item" id="btn-logout-menu" role="menuitem">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                Logout
              </button>
            </div>
          </div>
        </div>
      </header>

      <div id="view-root" aria-live="polite"></div>
    </main>
  </div>

  <div class="drawer-backdrop" id="drawer-backdrop"></div>
  <aside class="drawer" id="drawer" aria-label="Details">
    <div class="drawer__head">
      <div>
        <h2 class="mono" id="drawer-title" style="margin:0 0 .4rem;font-size:1rem;">—</h2>
        <span class="badge" id="drawer-status">—</span>
      </div>
      <button type="button" class="btn" id="drawer-close" aria-label="Close">Close</button>
    </div>
    <div class="drawer__body" id="drawer-body"></div>
    <div class="drawer__foot">
      <div class="drawer__actions" id="drawer-actions"></div>
      <a class="btn btn-primary" id="drawer-public" href="#" target="_blank" rel="noopener">Open public tracking</a>
    </div>
  </aside>

  <div class="drawer-backdrop" id="chat-drawer-backdrop"></div>
  <aside class="drawer drawer--chat" id="chat-drawer" aria-label="Support conversation" aria-hidden="true">
    <div class="drawer__head">
      <div>
        <h2 id="chat-drawer-title" style="margin:0 0 .35rem;font-size:1.05rem;">Conversation</h2>
        <p id="chat-drawer-sub" style="margin:0;color:var(--muted);font-size:.8rem;">Live homepage chat</p>
      </div>
      <div class="chat-drawer__head-actions">
        <button type="button" class="btn btn-warn" id="chat-drawer-end">End conversation</button>
        <button type="button" class="btn" id="chat-drawer-close" aria-label="Close conversation">Close</button>
      </div>
    </div>
    <div class="chat-msgs" id="chat-drawer-msgs"></div>
    <div class="drawer__foot chat-drawer__foot">
      <form class="chat-compose" id="chat-drawer-form">
        <input id="chat-drawer-input" placeholder="Type a reply…" autocomplete="off">
        <button type="submit">Send</button>
      </form>
    </div>
  </aside>

  <button type="button" class="admin-chat-fab" id="admin-chat-fab" aria-label="Open customer chats" aria-haspopup="dialog" aria-expanded="false">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
      <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
    </svg>
    <span class="admin-chat-fab__badge" id="admin-chat-fab-badge" aria-hidden="true">0</span>
  </button>

  <div class="admin-chat-inbox" id="admin-chat-inbox" hidden>
    <div class="admin-chat-inbox__backdrop" data-chat-inbox-close></div>
    <section class="admin-chat-inbox__panel" role="dialog" aria-modal="true" aria-labelledby="admin-chat-inbox-title">
      <header class="admin-chat-inbox__head">
        <div>
          <h2 id="admin-chat-inbox-title">Customer chats</h2>
          <p id="admin-chat-inbox-sub">Open a conversation to reply</p>
        </div>
        <button type="button" class="admin-chat-inbox__close" data-chat-inbox-close aria-label="Close chats">&times;</button>
      </header>
      <div class="admin-chat-inbox__list" id="admin-chat-inbox-list"></div>
    </section>
  </div>

  <script src="/resource/js/realtime.js?v=20261102i"></script>
  <script src="/resource/admin/js/api.js?v=20261102p53"></script>
  <script src="/resource/admin/js/utils.js?v=20261102p54"></script>
  <script src="/resource/admin/js/map.js?v=20261102p54"></script>
  <script src="/resource/admin/js/views/dashboard.js?v=20261102p56"></script>
  <script src="/resource/admin/js/views/operations.js?v=20261102p47"></script>
  <script src="/resource/admin/js/views/create-shipment.js?v=20261102p45"></script>
  <script src="/resource/admin/js/views/system.js?v=20261102p45"></script>
  <script src="/resource/admin/js/app.js?v=20261102p57"></script>
</body>
</html>
